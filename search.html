<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหาประวัติ - สถิติสังคมสงเคราะห์</title><link rel="icon" type="image/png" href="https://img2.pic.in.th/Logo-sw.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #333; }
        .bg-maroon { background-color: #7f1d1d; }
        .text-maroon { color: #7f1d1d; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-5xl mx-auto">
        <div class="bg-white p-4 rounded-xl shadow-md mb-6 border-l-8 border-maroon flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <img src="https://lh3.googleusercontent.com/d/1w9dv8BltC93WibjdTALKV1d2kyMR6MWm" alt="Logo" class="h-16 w-16 object-contain">
                <div>
                    <h1 class="text-2xl font-bold text-maroon">ค้นหาประวัติผู้ใช้บริการ</h1>
                    <p class="text-gray-500 text-sm">กลุ่มงานสังคมสงเคราะห์ โรงพยาบาลสมเด็จพระสังฆราช (อมฺพรมหาเถร)</p>
                </div>
            </div>

            <div id="navPlaceholder"></div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 mb-6">
            <form id="searchForm" onsubmit="handleSearch(event)" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full md:w-1/3">
                    <label class="block text-sm font-bold text-gray-700 mb-1">ค้นหาจาก</label>
                    <select id="searchType" class="w-full border-2 border-gray-200 rounded-lg p-2.5 focus:border-maroon outline-none text-gray-700">
                        <option value="all">ทุกฟิลด์ (HN/AN/ชื่อ/เลขบัตร)</option>
                        <option value="hn">HN</option>
                        <option value="an">AN</option>
                        <option value="name">ชื่อ - นามสกุล</option>
                        <option value="idcard">เลขประจำตัวประชาชน / Passport</option>
                    </select>
                </div>
                <div class="w-full md:w-1/2">
                    <label class="block text-sm font-bold text-gray-700 mb-1">คำค้นหา</label>
                    <input type="text" id="searchValue" class="w-full border-2 border-gray-200 rounded-lg p-2.5 focus:border-maroon outline-none text-gray-700" placeholder="ระบุข้อมูลที่ต้องการค้นหา..." required>
                </div>
                <div class="w-full md:w-auto">
                    <button type="submit" id="searchBtn" class="w-full bg-maroon text-white font-bold py-2.5 px-6 rounded-lg hover:bg-red-900 transition shadow-sm flex items-center justify-center">
                        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        ค้นหาประวัติ
                    </button>
                </div>
            </form>
        </div>

        <div id="loading" class="hidden text-center my-10">
            <svg class="animate-spin h-10 w-10 text-maroon mx-auto mb-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span class="text-gray-600 font-semibold">กำลังค้นหาข้อมูล...</span>
        </div>

        <div id="resultSummary" class="hidden mb-4 text-gray-700 font-semibold pl-2"></div>

        <div id="resultsContainer" class="space-y-4"></div>

        <div id="paginationBar" class="hidden flex items-center justify-center gap-3 py-6"></div>
    </div>

    <script src="common.js"></script>
    <script>
        const PAGE_SIZE = 10;
        let allResults = [];
        let currentPage = 1;

        window.onload = function () {
            loadNav('sw-header-light', 'search');
        };

        async function handleSearch(e) {
            e.preventDefault();
            const searchType = document.getElementById('searchType').value;
            const searchValue = document.getElementById('searchValue').value;
            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const container = document.getElementById('resultsContainer');
            const summary = document.getElementById('resultSummary');
            const pagination = document.getElementById('paginationBar');

            btn.disabled = true;
            loading.classList.remove('hidden');
            container.innerHTML = '';
            summary.classList.add('hidden');
            pagination.classList.add('hidden');

            try {
                const response = await apiGet('search', { type: searchType, value: searchValue });
                btn.disabled = false;
                loading.classList.add('hidden');

                if (!response.success) {
                    Swal.fire('ข้อผิดพลาด', response.error, 'error');
                    return;
                }

                allResults = response.data;
                currentPage = 1;

                summary.innerHTML = `พบประวัติการรับบริการ <b>${allResults.length}</b> ครั้ง (เรียงจากล่าสุด)`;
                summary.classList.remove('hidden');

                if (allResults.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white p-8 rounded-xl shadow-sm text-center border border-gray-100">
                            <span class="text-4xl">📭</span>
                            <p class="text-gray-500 mt-2 font-bold text-lg">ไม่พบข้อมูลประวัติ</p>
                            <p class="text-sm text-gray-400">โปรดตรวจสอบคำค้นหาอีกครั้ง</p>
                        </div>
                    `;
                    return;
                }

                renderPage();
            } catch (err) {
                btn.disabled = false;
                loading.classList.add('hidden');
                showApiError(err);
            }
        }

        function maskIdCard(id) {
            const digits = (id || '').replace(/[^0-9A-Za-z]/g, '');
            if (digits.length < 6) return id;
            return digits.slice(0, 1) + '-XXXX-XXXXX-XX-' + digits.slice(-1);
        }

        function renderPage() {
            const container = document.getElementById('resultsContainer');

            const totalPages = Math.max(1, Math.ceil(allResults.length / PAGE_SIZE));
            currentPage = Math.min(Math.max(1, currentPage), totalPages);
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = allResults.slice(start, start + PAGE_SIZE);

            let html = '';
            pageItems.forEach((r, idx) => {
                const globalIndex = start + idx;
                const maskedId = maskIdCard(r.idcard);
                const editUrl = r.id ? `index.html?id=${encodeURIComponent(r.id)}` : '';

                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                        <div class="bg-red-50 border-l-4 border-maroon p-4 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-100 gap-3">
                            <div>
                                <h3 class="text-lg font-bold text-maroon mb-1">👤 ${r.name}</h3>
                                <p class="text-sm text-gray-600 flex flex-wrap items-center gap-x-2">
                                    HN: <span class="font-bold text-gray-800">${r.hn}</span> |
                                    AN: <span class="font-bold text-gray-800">${r.an}</span> |
                                    บัตรปชช/Passport:
                                    <span class="font-bold text-gray-800 idcard-value" data-full="${r.idcard}" data-masked="${maskedId}">${maskedId}</span>
                                    <button type="button" class="text-xs underline text-blue-600" onclick="toggleIdCard(${globalIndex})">แสดง/ซ่อน</button>
                                </p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="bg-white border border-red-200 text-maroon px-3 py-1 rounded-md text-sm font-bold shadow-sm">📅 ${r.date}</span>
                                ${editUrl ? `<a href="${editUrl}" class="bg-maroon text-white px-3 py-1.5 rounded-md text-sm font-bold shadow-sm hover:bg-red-900 transition">✏️ แก้ไข</a>` : ''}
                            </div>
                        </div>

                        <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-6 text-sm">
                            <div class="flex flex-col"><span class="text-gray-500 text-xs">อายุ</span><span class="font-semibold text-gray-800">${r.age} ปี</span></div>
                            <div class="flex flex-col"><span class="text-gray-500 text-xs">สิทธิการรักษา</span><span class="font-semibold text-gray-800">${r.insurance}</span></div>

                            <div class="md:col-span-2 flex flex-col border-t border-gray-100 pt-3"><span class="text-gray-500 text-xs">กลุ่มโรคของผู้รับบริการ</span><span class="font-semibold text-gray-800">${r.illness}</span></div>
                            <div class="md:col-span-2 flex flex-col"><span class="text-gray-500 text-xs">การประเมินปัญหาทางสังคม (เบื้องต้น)</span><span class="font-semibold text-gray-800">${r.assessment}</span></div>
                            <div class="md:col-span-2 flex flex-col"><span class="text-gray-500 text-xs">การให้บริการ</span><span class="font-semibold text-gray-800">${r.service}</span></div>
                            <div class="md:col-span-2 flex flex-col"><span class="text-gray-500 text-xs">การช่วยเหลือทางเศรษฐกิจ</span><span class="font-semibold text-green-700">${r.economic || '-'}</span></div>

                            <div class="md:col-span-2 bg-gray-50 p-4 rounded-lg border border-gray-200 mt-2">
                                <span class="font-bold text-maroon block mb-2 border-b border-gray-200 pb-1">📋 การวินิจฉัยปัญหาทางสังคม (Social Problem List)</span>
                                <div class="whitespace-pre-wrap text-gray-700 leading-relaxed">${r.socialProblems}</div>
                                ${r.note ? `<div class="mt-3 text-gray-600 bg-white p-2 rounded border border-gray-100"><b class="text-gray-700">รายละเอียดเพิ่มเติม:</b> ${r.note}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            renderPagination(totalPages);
        }

        function toggleIdCard(index) {
            const cards = document.querySelectorAll('.idcard-value');
            const card = cards[index % cards.length];
            if (!card) return;
            const showing = card.dataset.showing === '1';
            card.textContent = showing ? card.dataset.masked : card.dataset.full;
            card.dataset.showing = showing ? '0' : '1';
        }

        function renderPagination(totalPages) {
            const pagination = document.getElementById('paginationBar');
            if (totalPages <= 1) {
                pagination.classList.add('hidden');
                return;
            }
            pagination.classList.remove('hidden');

            let html = '';
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="gotoPage(${currentPage - 1})" class="px-3 py-1.5 rounded-lg border border-gray-200 text-sm font-bold text-gray-600 disabled:opacity-40 hover:bg-gray-50">← ก่อนหน้า</button>`;
            html += `<span class="text-sm text-gray-600 font-semibold">หน้า ${currentPage} / ${totalPages}</span>`;
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="gotoPage(${currentPage + 1})" class="px-3 py-1.5 rounded-lg border border-gray-200 text-sm font-bold text-gray-600 disabled:opacity-40 hover:bg-gray-50">ถัดไป →</button>`;
            pagination.innerHTML = html;
        }

        function gotoPage(page) {
            currentPage = page;
            renderPage();
            window.scrollTo({ top: document.getElementById('resultSummary').offsetTop - 20, behavior: 'smooth' });
        }
    </script>
</body>
</html>
